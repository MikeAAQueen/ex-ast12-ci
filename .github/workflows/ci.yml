name: verificar-api

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verificar-api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar Testes Unitários com Pytest
        run: |
          pytest

      - name: Subir a API e testar requisição (Integração)
        run: |
          # Inicia a API em segundo plano na porta 8000
          uvicorn main:app --port 8000 &
          # Aguarda 3 segundos para inicializar o servidor
          sleep 3
          # Executa as requisições com curl -f (falha em erro 4xx/5xx)
          curl -f http://localhost:8000/
          curl -f http://localhost:8000/somar/10/20
